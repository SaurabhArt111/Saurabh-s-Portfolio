<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FolderVault</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a090d;
            --surface: #111018;
            --surface2: #18161f;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.15);
            --accent: #c8a8f9;
            --accent2: #f9a8d4;
            --accent3: #a8d4f9;
            --text: #f0edf8;
            --muted: #6b6480;
            --muted2: #9d97b0;
            --red: #f97b8a;
            --green: #a8f9c8;
            --yellow: #f9e4a8;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(200, 168, 249, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(ellipse, rgba(249, 168, 212, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 36px;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            background: rgba(10, 9, 13, 0.85);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .logo span {
            color: var(--muted2);
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--muted);
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        .stat-chip .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
        }

        .stat-chip.live .dot {
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        /* FIX #12 - Reset button */
        #resetBtn {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--muted2);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #resetBtn:hover {
            border-color: rgba(249, 123, 138, 0.4);
            color: var(--red);
            background: rgba(249, 123, 138, 0.06);
        }

        #resetBtn:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Upload Zone */
        .upload-zone {
            position: relative;
            z-index: 5;
            margin: 40px auto;
            max-width: 680px;
            padding: 0 24px;
        }

        /* FIX #13 - Compat warning */
        .compat-warning {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: rgba(249, 228, 168, 0.07);
            border: 1px solid rgba(249, 228, 168, 0.2);
            border-radius: 10px;
            margin-bottom: 14px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--yellow);
        }

        .drop-card {
            position: relative;
            border: 1.5px dashed var(--border-hover);
            border-radius: 20px;
            padding: 52px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            background: var(--surface);
            overflow: hidden;
        }

        .drop-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(200, 168, 249, 0.08) 0%, transparent 60%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s;
        }

        .drop-card:hover::before,
        .drop-card.dragging::before {
            opacity: 1;
        }

        .drop-card:hover,
        .drop-card.dragging {
            border-color: rgba(200, 168, 249, 0.4);
            box-shadow: 0 0 0 1px rgba(200, 168, 249, 0.1), 0 20px 60px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .drop-card:focus {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        #folderInput {
            display: none;
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(200, 168, 249, 0.15), rgba(249, 168, 212, 0.08));
            border-radius: 16px;
            border: 1px solid rgba(200, 168, 249, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform 0.3s;
        }

        .drop-card:hover .upload-icon {
            transform: scale(1.08) rotate(-3deg);
        }

        .upload-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .upload-sub {
            font-size: 13px;
            color: var(--muted2);
            font-family: 'DM Mono', monospace;
            margin-bottom: 24px;
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #1a0a2e;
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.02em;
        }

        .upload-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 24px rgba(200, 168, 249, 0.3);
        }

        .upload-btn:focus {
            outline: 2px solid #1a0a2e;
            outline-offset: 2px;
        }

        .type-pills {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .type-pill {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        /* Toolbar */
        .toolbar {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 36px 20px;
            flex-wrap: wrap;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            flex-wrap: wrap;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-wrap {
            position: relative;
            flex: 1;
            max-width: 320px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 14px;
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 9px 14px 9px 36px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            outline: none;
            transition: all 0.2s;
        }

        #searchInput:focus {
            border-color: rgba(200, 168, 249, 0.4);
            box-shadow: 0 0 0 3px rgba(200, 168, 249, 0.07);
        }

        #searchInput::placeholder {
            color: var(--muted);
        }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--muted2);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: rgba(200, 168, 249, 0.4);
            color: var(--accent);
            background: rgba(200, 168, 249, 0.06);
        }

        .filter-btn:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .filter-btn .badge {
            background: var(--accent);
            color: #1a0a2e;
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 10px;
            font-weight: 700;
        }

        .view-toggle {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .view-btn {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--muted);
            font-size: 14px;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: rgba(200, 168, 249, 0.12);
            color: var(--accent);
        }

        .view-btn:focus {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        /* Sort bar */
        .sort-bar {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 36px 16px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--muted);
        }

        .sort-bar>span {
            margin-right: 4px;
        }

        .sort-opt {
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            transition: all 0.15s;
        }

        .sort-opt:hover {
            color: var(--text);
        }

        .sort-opt.active {
            background: rgba(200, 168, 249, 0.1);
            color: var(--accent);
        }

        .sort-opt:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* FIX #6 - Error log */
        #errorLog {
            position: relative;
            z-index: 5;
            margin: 0 36px 16px;
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        #errorLog.has-errors {
            display: flex;
        }

        .error-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            background: rgba(249, 123, 138, 0.07);
            border: 1px solid rgba(249, 123, 138, 0.2);
            border-radius: 10px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--red);
        }

        /* Gallery */
        #gallery {
            position: relative;
            z-index: 5;
            padding: 0 36px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        #gallery.list-view {
            grid-template-columns: 1fr;
            gap: 6px;
        }

        /* Cards */
        .media-card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            animation: cardIn 0.4s cubic-bezier(0.23, 1, 0.32, 1) both;
        }

        /* FIX #9 - keyboard focus */
        .media-card:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .media-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(200, 168, 249, 0.08);
            z-index: 2;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-thumb {
            position: relative;
            aspect-ratio: 4/3;
            overflow: hidden;
            background: var(--surface2);
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .media-card:hover .card-thumb img {
            transform: scale(1.06);
        }

        .card-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .file-thumb {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 10px;
            padding: 20px;
        }

        .file-ext {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .thumb-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
        }

        .thumb-badge.img {
            background: rgba(168, 212, 249, 0.2);
            color: var(--accent3);
            border: 1px solid rgba(168, 212, 249, 0.2);
        }

        .thumb-badge.vid {
            background: rgba(249, 168, 212, 0.2);
            color: var(--accent2);
            border: 1px solid rgba(249, 168, 212, 0.2);
        }

        .thumb-badge.file {
            background: rgba(200, 168, 249, 0.2);
            color: var(--accent);
            border: 1px solid rgba(200, 168, 249, 0.2);
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.2s;
            backdrop-filter: blur(1px);
        }

        .media-card:hover .play-overlay,
        .media-card:focus .play-overlay {
            opacity: 1;
        }

        .play-btn-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            backdrop-filter: blur(8px);
            transition: transform 0.2s;
        }

        .media-card:hover .play-btn-icon {
            transform: scale(1.1);
        }

        .card-info {
            padding: 10px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--muted);
        }

        .card-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.2s;
        }

        .media-card:hover .card-actions,
        .media-card:focus .card-actions {
            opacity: 1;
            transform: translateY(0);
        }

        .action-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(10, 9, 13, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text);
        }

        .action-btn:hover {
            background: rgba(200, 168, 249, 0.2);
            border-color: rgba(200, 168, 249, 0.4);
        }

        .action-btn:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        /* List view */
        #gallery.list-view .media-card {
            display: flex;
            align-items: center;
            border-radius: 10px;
            transform: none !important;
        }

        #gallery.list-view .media-card:hover {
            transform: translateX(4px) !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        #gallery.list-view .card-thumb {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            aspect-ratio: unset;
            border-radius: 0;
        }

        #gallery.list-view .card-thumb .file-thumb {
            padding: 8px;
        }

        #gallery.list-view .card-thumb .file-ext {
            font-size: 14px;
        }

        #gallery.list-view .card-info {
            flex: 1;
            flex-direction: row;
            align-items: center;
            padding: 0 16px;
            gap: 0;
        }

        #gallery.list-view .card-name {
            flex: 1;
            font-size: 13px;
        }

        #gallery.list-view .card-meta {
            flex-shrink: 0;
        }

        #gallery.list-view .thumb-badge,
        #gallery.list-view .play-overlay {
            display: none;
        }

        #gallery.list-view .card-actions {
            top: 50%;
            right: 12px;
            transform: translateY(-50%) translateX(4px);
        }

        #gallery.list-view .media-card:hover .card-actions {
            transform: translateY(-50%) translateX(0);
        }

        /* FIX #8 - sentinel */
        #loadSentinel {
            height: 1px;
            width: 100%;
            grid-column: 1 / -1;
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(5, 4, 8, 0.93);
            backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #lightbox.open {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox-inner {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .lightbox-media {
            max-width: 85vw;
            max-height: 78vh;
            border-radius: 12px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
            display: block;
        }

        .lightbox-caption {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--muted2);
            text-align: center;
        }

        .lightbox-close {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            color: var(--muted2);
            transition: all 0.2s;
            z-index: 1001;
        }

        .lightbox-close:hover {
            border-color: var(--border-hover);
            color: var(--text);
        }

        .lightbox-close:focus,
        .lightbox-nav:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: var(--muted2);
            transition: all 0.2s;
            z-index: 1001;
        }

        .lightbox-nav:hover {
            border-color: var(--border-hover);
            color: var(--text);
        }

        #lbPrev {
            left: 20px;
        }

        #lbNext {
            right: 20px;
        }

        #emptyState {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            display: none;
            grid-column: 1 / -1;
        }

        #emptyState.visible {
            display: block;
        }

        #progressBar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            z-index: 9999;
            width: 0%;
            opacity: 0;
            transition: width 0.4s, opacity 0.4s;
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            padding: 10px 20px;
            border-radius: 10px;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--text);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 9999;
            white-space: nowrap;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Stagger */
        .media-card:nth-child(1) {
            animation-delay: .03s
        }

        .media-card:nth-child(2) {
            animation-delay: .06s
        }

        .media-card:nth-child(3) {
            animation-delay: .09s
        }

        .media-card:nth-child(4) {
            animation-delay: .12s
        }

        .media-card:nth-child(5) {
            animation-delay: .15s
        }

        .media-card:nth-child(6) {
            animation-delay: .18s
        }

        .media-card:nth-child(7) {
            animation-delay: .21s
        }

        .media-card:nth-child(8) {
            animation-delay: .24s
        }

        .media-card:nth-child(9) {
            animation-delay: .27s
        }

        .media-card:nth-child(10) {
            animation-delay: .30s
        }

        @media (max-width: 600px) {
            header {
                padding: 14px 16px;
            }

            .upload-zone {
                padding: 0 12px;
            }

            .drop-card {
                padding: 36px 20px;
            }

            #gallery {
                padding: 0 12px 60px;
                gap: 10px;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .toolbar {
                padding: 0 12px 16px;
            }

            .sort-bar {
                padding: 0 12px 12px;
            }

            #errorLog {
                margin: 0 12px 12px;
            }

            .header-right .stat-chip:first-child {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- FIX #9 - Skip link -->
    <a href="#gallery"
        style="position:absolute;left:-9999px;top:0;z-index:9999;padding:8px 16px;background:var(--accent);color:#1a0a2e;border-radius:0 0 8px 0;font-weight:700;font-size:13px"
        onfocus="this.style.left='0'" onblur="this.style.left='-9999px'">Skip to gallery</a>

    <div id="progressBar" role="progressbar" aria-label="Loading files"></div>

    <header>
        <div class="logo" aria-label="FolderVault">
            <div class="logo-icon" aria-hidden="true">📁</div>
            FolderVault <span>/ explorer</span>
        </div>
        <div class="header-right">
            <div class="stat-chip" aria-live="polite">
                <div class="dot" aria-hidden="true"></div>
                <span id="totalCount">0 files</span>
            </div>
            <div class="stat-chip live">
                <div class="dot" aria-hidden="true"></div>
                <span id="statusText">ready</span>
            </div>
            <!-- FIX #12 - reset / change folder -->
            <button id="resetBtn" aria-label="Load a different folder">↺ Change Folder</button>
        </div>
    </header>

    <div class="upload-zone" id="uploadZone">
        <!-- FIX #13 - browser compat warning (shown by JS) -->
        <div class="compat-warning" id="compatWarning" role="alert">
            ⚠ Your browser may have limited folder-selection support. Some files might not load correctly.
        </div>
        <div class="drop-card" id="dropCard" role="button" tabindex="0"
            aria-label="Drop a folder here or press Enter to browse" aria-describedby="uploadDesc">
            <input type="file" id="folderInput" webkitdirectory multiple aria-label="Select folder">
            <div class="upload-icon" aria-hidden="true">📂</div>
            <div class="upload-title">Drop your folder here</div>
            <div class="upload-sub" id="uploadDesc">or click to browse</div>
            <button class="upload-btn" id="browseBtn" type="button">✦ &nbsp;Choose Folder</button>
            <div class="type-pills" aria-label="Supported file types">
                <span class="type-pill">JPG · PNG · GIF · WEBP</span>
                <span class="type-pill">MP4 · WEBM · MOV</span>
                <span class="type-pill">PDF · SVG · ANY</span>
            </div>
        </div>
    </div>

    <!-- FIX #6 - Error log -->
    <div id="errorLog" role="alert" aria-label="File load errors"></div>

    <!-- Toolbar -->
    <div class="toolbar" id="toolbar" style="display:none" role="toolbar" aria-label="Gallery controls">
        <div class="toolbar-left">
            <div class="search-wrap" role="search">
                <div class="search-icon" aria-hidden="true">🔍</div>
                <input type="text" id="searchInput" placeholder="Search files…" aria-label="Search files"
                    autocomplete="off">
            </div>
            <button class="filter-btn active" data-filter="all" aria-pressed="true">All <span class="badge"
                    id="badgeAll">0</span></button>
            <button class="filter-btn" data-filter="image" aria-pressed="false">🖼 Images <span class="badge"
                    id="badgeImg">0</span></button>
            <button class="filter-btn" data-filter="video" aria-pressed="false">🎞 Videos <span class="badge"
                    id="badgeVid">0</span></button>
            <button class="filter-btn" data-filter="file" aria-pressed="false">📄 Files <span class="badge"
                    id="badgeFile">0</span></button>
        </div>
        <div class="toolbar-right">
            <div class="view-toggle" role="group" aria-label="View mode">
                <button class="view-btn active" id="gridViewBtn" aria-pressed="true" aria-label="Grid view">⊞</button>
                <button class="view-btn" id="listViewBtn" aria-pressed="false" aria-label="List view">☰</button>
            </div>
        </div>
    </div>

    <div class="sort-bar" id="sortBar" style="display:none" role="group" aria-label="Sort options">
        <span>sort by</span>
        <button class="sort-opt active" data-sort="name" aria-pressed="true">name</button>
        <button class="sort-opt" data-sort="type" aria-pressed="false">type</button>
        <button class="sort-opt" data-sort="size" aria-pressed="false">size</button>
    </div>

    <div id="emptyState" role="status">✦ No matching files found</div>
    <div id="gallery" role="list" aria-label="File gallery">
        <div id="loadSentinel" aria-hidden="true"></div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" role="dialog" aria-modal="true" aria-label="File viewer" aria-hidden="true">
        <div class="lightbox-inner">
            <div id="lightboxContent"></div>
            <div class="lightbox-caption" id="lightboxCaption" aria-live="polite"></div>
        </div>
        <button class="lightbox-close" id="lbClose" aria-label="Close viewer">✕</button>
        <button class="lightbox-nav" id="lbPrev" aria-label="Previous file">‹</button>
        <button class="lightbox-nav" id="lbNext" aria-label="Next file">›</button>
    </div>

    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script>
        'use strict';

        /* ── STATE ── */
        let allFiles = [];
        let filteredFiles = [];
        let mediaFiles = [];
        let currentFilter = 'all';
        let currentSort = 'name';
        let currentLbIndex = 0;
        let lbKeyHandler = null;
        let lastFocused = null;
        let renderOffset = 0;
        let isRendering = false;
        const PAGE_SIZE = 40;

        /* ═══════════════════════════════════════════════
           FIX #1 #3 — CENTRAL URL CACHE
           One object-URL per file object, revoked on reset.
        ═══════════════════════════════════════════════ */
        const urlCache = new Map();

        function getUrl(file) {
            if (!urlCache.has(file)) urlCache.set(file, URL.createObjectURL(file));
            return urlCache.get(file);
        }

        function revokeAllUrls() {
            urlCache.forEach(url => URL.revokeObjectURL(url));
            urlCache.clear();
        }

        /* ═══════════════════════════════════════════════
           FIX #4 — ROBUST FILE TYPE DETECTION
           MIME type first; extension fallback for files
           that browsers report as empty MIME.
        ═══════════════════════════════════════════════ */
        const IMAGE_EXTS = new Set(['jpg', 'jpeg', 'png', 'gif', 'webp', 'avif', 'bmp', 'svg', 'ico', 'tiff', 'tif']);
        const VIDEO_EXTS = new Set(['mp4', 'webm', 'mov', 'avi', 'mkv', 'ogv', 'm4v', '3gp', 'flv', 'wmv']);

        function fileType(file) {
            if (file.type.startsWith('image/')) return 'image';
            if (file.type.startsWith('video/')) return 'video';
            const ext = file.name.split('.').pop().toLowerCase();
            if (IMAGE_EXTS.has(ext)) return 'image';
            if (VIDEO_EXTS.has(ext)) return 'video';
            return 'file';
        }

        /* ── UTILS ── */
        function fmtSize(b) {
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1048576).toFixed(1) + ' MB';
        }
        function getExt(name) {
            const p = name.split('.');
            return p.length > 1 ? p.pop().toUpperCase() : '?';
        }

        /* ═══════════════════════════════════════════════
           FIX #11 — DEDUPLICATION KEY
           name + size + lastModified uniquely identifies
           a file regardless of how it was collected.
        ═══════════════════════════════════════════════ */
        function fileKey(f) { return `${f.name}|${f.size}|${f.lastModified}`; }

        /* ═══════════════════════════════════════════════
           FIX #13 — BROWSER COMPATIBILITY CHECK
        ═══════════════════════════════════════════════ */
        (function checkCompat() {
            const hasDir = 'webkitdirectory' in document.createElement('input');
            const isModern = /Chrome|Edg|Firefox/.test(navigator.userAgent);
            if (!hasDir || !isModern) {
                document.getElementById('compatWarning').style.display = 'flex';
            }
        })();

        /* ═══════════════════════════════════════════════
           FIX #2 #5 — COMPLETE ASYNC DIRECTORY TRAVERSAL
           readEntries() only returns ≤100 items per call.
           We loop until an empty batch signals completion,
           then await everything with Promise.all — no
           fragile setTimeout needed.
        ═══════════════════════════════════════════════ */
        function readAllEntries(dirReader) {
            return new Promise((resolve, reject) => {
                const collected = [];
                (function readBatch() {
                    dirReader.readEntries(batch => {
                        if (!batch.length) return resolve(collected);
                        collected.push(...batch);
                        readBatch();          // keep reading until empty
                    }, reject);
                })();
            });
        }

        async function traverseEntry(entry) {
            try {
                if (entry.isFile) {
                    return [await new Promise((res, rej) => entry.file(res, rej))];
                }
                if (entry.isDirectory) {
                    const reader = entry.createReader();
                    const entries = await readAllEntries(reader);
                    const nested = await Promise.all(entries.map(traverseEntry));
                    return nested.flat();
                }
            } catch (err) {
                // FIX #6 — surface individual file errors
                addError(`Could not read "${entry.name}": ${err.message || err}`);
            }
            return [];
        }

        /* ═══════════════════════════════════════════════
           FIX #6 — ERROR LOG
        ═══════════════════════════════════════════════ */
        function addError(msg) {
            const log = document.getElementById('errorLog');
            log.classList.add('has-errors');
            const item = document.createElement('div');
            item.className = 'error-item';
            item.textContent = '⚠ ' + msg;
            log.appendChild(item);
        }
        function clearErrors() {
            const log = document.getElementById('errorLog');
            log.innerHTML = '';
            log.classList.remove('has-errors');
        }

        /* ═══════════════════════════════════════════════
           INPUT HANDLERS
        ═══════════════════════════════════════════════ */
        document.getElementById('folderInput').addEventListener('change', e => {
            const files = Array.from(e.target.files);
            if (files.length) loadFiles(files);
        });

        // FIX #9 #10 — keyboard activation + event listeners (no inline onclick)
        const dropCard = document.getElementById('dropCard');
        document.getElementById('browseBtn').addEventListener('click', e => {
            e.stopPropagation();
            document.getElementById('folderInput').click();
        });
        dropCard.addEventListener('click', e => {
            if (!e.target.closest('#browseBtn')) document.getElementById('folderInput').click();
        });
        dropCard.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); document.getElementById('folderInput').click(); }
        });

        /* ── DRAG & DROP ── FIX #2 #5 #6 */
        dropCard.addEventListener('dragover', e => { e.preventDefault(); dropCard.classList.add('dragging'); });
        dropCard.addEventListener('dragleave', () => dropCard.classList.remove('dragging'));
        dropCard.addEventListener('drop', async e => {
            e.preventDefault();
            dropCard.classList.remove('dragging');
            showProgress(30);
            try {
                // FIX #2 #5 — fully async, no setTimeout
                const items = Array.from(e.dataTransfer.items);
                const promises = items.map(item => {
                    const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                    if (entry) return traverseEntry(entry);
                    const file = item.getAsFile();
                    return Promise.resolve(file ? [file] : []);
                });
                const files = (await Promise.all(promises)).flat().filter(Boolean);
                if (files.length) loadFiles(files);
                else showToast('⚠ No files found in drop');
            } catch (err) {
                addError('Drag-and-drop failed: ' + (err.message || err));
                hideProgress();
            }
        });

        /* ═══════════════════════════════════════════════
           LOAD — FIX #1 #11
        ═══════════════════════════════════════════════ */
        function loadFiles(newFiles) {
            showProgress(50);
            clearErrors();
            revokeAllUrls();   // FIX #1 — release previous session

            // FIX #11 — deduplicate
            const seen = new Set();
            const deduped = newFiles.filter(f => {
                const k = fileKey(f);
                if (seen.has(k)) return false;
                seen.add(k); return true;
            });

            allFiles = deduped;
            processFiles(newFiles.length - deduped.length);
        }

        function processFiles(dupsRemoved = 0) {
            document.getElementById('uploadZone').style.display = 'none';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('sortBar').style.display = 'flex';
            document.getElementById('resetBtn').style.display = 'flex';

            const counts = { image: 0, video: 0, file: 0 };
            allFiles.forEach(f => counts[fileType(f)]++);

            document.getElementById('badgeAll').textContent = allFiles.length;
            document.getElementById('badgeImg').textContent = counts.image;
            document.getElementById('badgeVid').textContent = counts.video;
            document.getElementById('badgeFile').textContent = counts.file;
            document.getElementById('totalCount').textContent = allFiles.length + ' files';
            document.getElementById('statusText').textContent = 'loaded';

            // reset search & filter state
            currentFilter = 'all';
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.filter-btn').forEach(b => {
                const a = b.dataset.filter === 'all';
                b.classList.toggle('active', a);
                b.setAttribute('aria-pressed', a);
            });

            applyFilters();
            hideProgress();

            let msg = `✦ Loaded ${allFiles.length} files`;
            if (dupsRemoved > 0) msg += `  ·  ${dupsRemoved} duplicate${dupsRemoved > 1 ? 's' : ''} skipped`;
            showToast(msg);
        }

        /* ═══════════════════════════════════════════════
           FIX #12 — RESET
        ═══════════════════════════════════════════════ */
        document.getElementById('resetBtn').addEventListener('click', () => {
            revokeAllUrls();
            allFiles = filteredFiles = mediaFiles = [];
            renderOffset = 0;

            const g = document.getElementById('gallery');
            g.innerHTML = '<div id="loadSentinel" aria-hidden="true"></div>';
            reattachSentinel();

            document.getElementById('uploadZone').style.display = 'block';
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('sortBar').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('emptyState').classList.remove('visible');
            document.getElementById('totalCount').textContent = '0 files';
            document.getElementById('statusText').textContent = 'ready';
            document.getElementById('folderInput').value = '';
            clearErrors();
            showToast('↺ Ready for a new folder');
        });

        /* ═══════════════════════════════════════════════
           FILTER / SORT — FIX #10 (delegation, no inline)
        ═══════════════════════════════════════════════ */
        document.getElementById('toolbar').addEventListener('click', e => {
            const fb = e.target.closest('.filter-btn');
            if (fb) setFilter(fb.dataset.filter);
            const vb = e.target.closest('.view-btn');
            if (vb) setView(vb.id === 'gridViewBtn' ? 'grid' : 'list');
        });
        document.getElementById('sortBar').addEventListener('click', e => {
            const so = e.target.closest('.sort-opt');
            if (so) setSort(so.dataset.sort);
        });
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => {
                const a = b.dataset.filter === f;
                b.classList.toggle('active', a);
                b.setAttribute('aria-pressed', a);
            });
            applyFilters();
        }

        function setSort(s) {
            currentSort = s;
            document.querySelectorAll('.sort-opt').forEach(b => {
                const a = b.dataset.sort === s;
                b.classList.toggle('active', a);
                b.setAttribute('aria-pressed', a);
            });
            applyFilters();
        }

        function applyFilters() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();

            filteredFiles = allFiles.filter(f => {
                const t = fileType(f);
                return (currentFilter === 'all' || t === currentFilter)
                    && (!q || f.name.toLowerCase().includes(q));
            });

            filteredFiles.sort((a, b) => {
                if (currentSort === 'name') return a.name.localeCompare(b.name);
                if (currentSort === 'type') return fileType(a).localeCompare(fileType(b));
                if (currentSort === 'size') return b.size - a.size;
                return 0;
            });

            mediaFiles = filteredFiles.filter(f => { const t = fileType(f); return t === 'image' || t === 'video'; });

            // FIX #8 — reset incremental render
            renderOffset = 0;
            const g = document.getElementById('gallery');
            g.innerHTML = '<div id="loadSentinel" aria-hidden="true"></div>';
            reattachSentinel();

            const empty = document.getElementById('emptyState');
            if (!filteredFiles.length) empty.classList.add('visible');
            else { empty.classList.remove('visible'); renderNextBatch(); }
        }

        /* ═══════════════════════════════════════════════
           FIX #8 — INCREMENTAL / PAGINATED RENDERING
           Renders PAGE_SIZE items at a time. IntersectionObserver
           watches a sentinel element and loads the next batch
           as the user scrolls — no UI freeze on large folders.
        ═══════════════════════════════════════════════ */
        let sentinelObserver = null;

        function reattachSentinel() {
            if (sentinelObserver) sentinelObserver.disconnect();
            const sentinel = document.getElementById('loadSentinel');
            if (!sentinel) return;
            sentinelObserver = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting && !isRendering) renderNextBatch();
            }, { rootMargin: '300px' });
            sentinelObserver.observe(sentinel);
        }

        function renderNextBatch() {
            if (isRendering) return;
            isRendering = true;
            const sentinel = document.getElementById('loadSentinel');
            const gallery = document.getElementById('gallery');
            const batch = filteredFiles.slice(renderOffset, renderOffset + PAGE_SIZE);
            if (!batch.length) { isRendering = false; return; }

            const frag = document.createDocumentFragment();
            batch.forEach(file => frag.appendChild(buildCard(file)));
            gallery.insertBefore(frag, sentinel);
            renderOffset += batch.length;
            isRendering = false;
        }

        /* ═══════════════════════════════════════════════
           FIX #3 #9 #10 — CARD BUILDER
           Uses cached URLs; all event listeners; full a11y.
        ═══════════════════════════════════════════════ */
        function buildCard(file) {
            const type = fileType(file);
            const url = getUrl(file);   // FIX #3 — cached

            const card = document.createElement('div');
            card.className = 'media-card';
            card.setAttribute('role', 'listitem');
            card.setAttribute('tabindex', '0');
            card.setAttribute('aria-label', `${file.name}, ${fmtSize(file.size)}, ${type}`);

            /* Thumbnail */
            const thumb = document.createElement('div');
            thumb.className = 'card-thumb';

            if (type === 'image') {
                const img = document.createElement('img');
                img.src = url; img.alt = file.name; img.loading = 'lazy';
                img.addEventListener('error', () => {   // FIX #6
                    img.replaceWith(buildFileThumb(file));
                    addError(`Cannot display: ${file.name}`);
                });
                thumb.appendChild(img);
                thumb.appendChild(makeBadge('img', 'IMG'));
                thumb.appendChild(makeOverlay('⤢'));
            } else if (type === 'video') {
                const vid = document.createElement('video');
                vid.src = url; vid.muted = true; vid.preload = 'metadata';
                vid.addEventListener('error', () => addError(`Cannot load: ${file.name}`));  // FIX #6
                thumb.appendChild(vid);
                thumb.appendChild(makeBadge('vid', 'VID'));
                thumb.appendChild(makeOverlay('▶'));
            } else {
                thumb.appendChild(buildFileThumb(file));
                thumb.appendChild(makeBadge('file', 'FILE'));
            }

            /* Download button — FIX #10 event listener */
            const actions = document.createElement('div');
            actions.className = 'card-actions';
            const dlBtn = document.createElement('button');
            dlBtn.className = 'action-btn'; dlBtn.type = 'button';
            dlBtn.title = 'Download'; dlBtn.setAttribute('aria-label', `Download ${file.name}`);
            dlBtn.textContent = '⬇';
            dlBtn.addEventListener('click', e => { e.stopPropagation(); doDownload(file); });
            actions.appendChild(dlBtn);
            thumb.appendChild(actions);
            card.appendChild(thumb);

            /* Info */
            const info = document.createElement('div');
            info.className = 'card-info';
            const nm = document.createElement('div');
            nm.className = 'card-name'; nm.title = file.name; nm.textContent = file.name;
            const mt = document.createElement('div');
            mt.className = 'card-meta';
            const s1 = document.createElement('span'); s1.textContent = fmtSize(file.size);
            const s2 = document.createElement('span'); s2.textContent = getExt(file.name);
            mt.appendChild(s1); mt.appendChild(s2);
            info.appendChild(nm); info.appendChild(mt);
            card.appendChild(info);

            /* Lightbox open — FIX #9 #10 */
            if (type === 'image' || type === 'video') {
                const open = e => {
                    if (e.target.closest('.action-btn')) return;
                    const idx = mediaFiles.indexOf(file);
                    if (idx !== -1) openLightbox(idx);
                };
                card.addEventListener('click', open);
                card.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(e); }
                });
            }

            return card;
        }

        function makeBadge(cls, label) {
            const b = document.createElement('div');
            b.className = `thumb-badge ${cls}`; b.textContent = label;
            b.setAttribute('aria-hidden', 'true'); return b;
        }
        function makeOverlay(icon) {
            const o = document.createElement('div');
            o.className = 'play-overlay'; o.setAttribute('aria-hidden', 'true');
            const i = document.createElement('div'); i.className = 'play-btn-icon'; i.textContent = icon;
            o.appendChild(i); return o;
        }
        function buildFileThumb(file) {
            const w = document.createElement('div'); w.className = 'file-thumb';
            const e = document.createElement('div'); e.className = 'file-ext';
            e.textContent = '.' + getExt(file.name);
            w.appendChild(e); return w;
        }

        /* ═══════════════════════════════════════════════
           VIEW TOGGLE — FIX #10
        ═══════════════════════════════════════════════ */
        function setView(v) {
            document.getElementById('gallery').classList.toggle('list-view', v === 'list');
            document.getElementById('gridViewBtn').classList.toggle('active', v === 'grid');
            document.getElementById('gridViewBtn').setAttribute('aria-pressed', v === 'grid');
            document.getElementById('listViewBtn').classList.toggle('active', v === 'list');
            document.getElementById('listViewBtn').setAttribute('aria-pressed', v === 'list');
        }

        /* ═══════════════════════════════════════════════
           LIGHTBOX — FIX #7 #9 #10
           Uses cached URLs, no new object-URL per open.
           Focus is trapped inside the dialog.
        ═══════════════════════════════════════════════ */
        function openLightbox(idx) {
            currentLbIndex = idx;
            lastFocused = document.activeElement;
            renderLightboxItem();
            const lb = document.getElementById('lightbox');
            lb.classList.add('open');
            lb.setAttribute('aria-hidden', 'false');
            document.getElementById('lbClose').focus();   // FIX #9

            if (lbKeyHandler) document.removeEventListener('keydown', lbKeyHandler);
            lbKeyHandler = e => {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') lbNav(1);
                if (e.key === 'ArrowLeft') lbNav(-1);
            };
            document.addEventListener('keydown', lbKeyHandler);
        }

        function renderLightboxItem() {
            const file = mediaFiles[currentLbIndex];
            const type = fileType(file);
            const url = getUrl(file);   // FIX #7 #3 — cached, not re-created
            const content = document.getElementById('lightboxContent');

            content.innerHTML = '';

            if (type === 'image') {
                const img = document.createElement('img');
                img.className = 'lightbox-media'; img.src = url; img.alt = file.name;
                img.addEventListener('error', () => addError(`Lightbox cannot display: ${file.name}`));
                content.appendChild(img);
            } else {
                const vid = document.createElement('video');
                vid.className = 'lightbox-media'; vid.src = url;
                vid.controls = true; vid.autoplay = true;
                vid.setAttribute('aria-label', file.name);
                content.appendChild(vid);
            }

            document.getElementById('lightboxCaption').textContent =
                `${file.name}  ·  ${fmtSize(file.size)}  ·  ${currentLbIndex + 1} / ${mediaFiles.length}`;
            document.getElementById('lbPrev').style.display = currentLbIndex === 0 ? 'none' : 'flex';
            document.getElementById('lbNext').style.display = currentLbIndex === mediaFiles.length - 1 ? 'none' : 'flex';
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            const vid = lb.querySelector('video');
            if (vid) { vid.pause(); vid.src = ''; }   // stop decoder

            lb.classList.remove('open');
            lb.setAttribute('aria-hidden', 'true');
            document.getElementById('lightboxContent').innerHTML = '';

            if (lbKeyHandler) { document.removeEventListener('keydown', lbKeyHandler); lbKeyHandler = null; }
            if (lastFocused) lastFocused.focus();   // FIX #9 — return focus
        }

        function lbNav(dir) {
            currentLbIndex = Math.max(0, Math.min(mediaFiles.length - 1, currentLbIndex + dir));
            renderLightboxItem();
        }

        /* FIX #10 — all lightbox controls use event listeners */
        document.getElementById('lbClose').addEventListener('click', closeLightbox);
        document.getElementById('lbPrev').addEventListener('click', () => lbNav(-1));
        document.getElementById('lbNext').addEventListener('click', () => lbNav(1));
        document.getElementById('lightbox').addEventListener('click', e => {
            if (e.target === document.getElementById('lightbox')) closeLightbox();
        });

        /* ═══════════════════════════════════════════════
           DOWNLOAD — FIX #3 (cached URL)
        ═══════════════════════════════════════════════ */
        function doDownload(file) {
            const a = document.createElement('a');
            a.href = getUrl(file); a.download = file.name;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            showToast(`⬇ Downloading ${file.name}`);
        }

        /* ── PROGRESS ── */
        function showProgress(pct = 70) {
            const pb = document.getElementById('progressBar');
            pb.style.opacity = '1'; pb.style.width = pct + '%';
        }
        function hideProgress() {
            const pb = document.getElementById('progressBar');
            pb.style.width = '100%';
            setTimeout(() => { pb.style.opacity = '0'; pb.style.width = '0%'; }, 400);
        }

        /* ── TOAST ── */
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
        }

        /* ── INIT ── */
        reattachSentinel();
    </script>
</body>

</html>
