<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Secure Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #111;
            color: white;
        }

        #container {
            text-align: center;
        }

        input {
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        #content {
            display: none;
        }
    </style>
</head>

<body>

    <div id="container">
        <h2>Checking Location...</h2>

        <div id="passwordBox" style="display:none;">
            <p>Enter Password</p>
            <input type="password" id="pass">
            <br>
            <button onclick="checkPassword()">Enter</button>
            <p id="msg"></p>
        </div>

        <div id="content">
            <h1>Welcome Saurabh 🔓</h1>
            <p>This is your protected page content.</p>
        </div>
    </div>

    <script>

        // 🔒 SETTINGS
        const allowedLat = 21.164958;   // Example: Shiv Shakti Laminates
        const allowedLon = 72.820547;   // Example: Surat
        const allowedRadius = 0.01;   // ~1km
        const correctPassword = "1234";

        // 📍 GET LOCATION
        navigator.geolocation.getCurrentPosition(success, error);

        function success(position) {
            let userLat = position.coords.latitude;
            let userLon = position.coords.longitude;

            let distance = Math.sqrt(
                Math.pow(userLat - allowedLat, 2) +
                Math.pow(userLon - allowedLon, 2)
            );

            if (distance <= allowedRadius) {
                document.querySelector("h2").innerText = "Location Verified ✔";
                document.getElementById("passwordBox").style.display = "block";
            } else {
                document.querySelector("h2").innerText = "Access Denied ❌ (Wrong Location)";
            }
        }

        function error() {
            document.querySelector("h2").innerText = "Location Permission Denied ❌";
        }

        // 🔑 PASSWORD CHECK
        function checkPassword() {
            let input = document.getElementById("pass").value;

            if (input === correctPassword) {
                document.getElementById("passwordBox").style.display = "none";
                document.getElementById("content").style.display = "block";
            } else {
                document.getElementById("msg").innerText = "Wrong Password ❌";
            }
        }

    </script>

</body>

</html>
