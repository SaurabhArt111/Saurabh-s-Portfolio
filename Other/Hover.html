<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effect</title>

    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://i.pinimg.com/1200x/43/9c/ac/439cac3a532f2ce137e1ad9d7bb221ae.jpg') no-repeat center center/cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hover_gallery {
            margin-top: 5rem;
            display: flex;
            height: 40rem;
            gap: 6px;
        }

        .hover_gallery div {
            flex: 1;
            cursor: pointer;
            border-radius: 8px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: auto 100%;
            transition: all .8s cubic-bezier(.25, .4, .45, 1.4);
        }

        .hover_gallery div:hover {
            flex: 5;
        }
    </style>
</head>

<body>
    <div class="hover_gallery">
        <div style="background-image: url('https://i.pinimg.com/1200x/87/ad/0d/87ad0d765df6a9434585cc7874deac67.jpg');">
        </div>
        <div style="background-image: url('https://i.pinimg.com/736x/a0/30/e9/a030e97561a760a240d8c63ced700115.jpg');">
        </div>

        </div>
        <div style="background-image: url('https://i.pinimg.com/736x/2f/9b/2c/2f9b2c7e97e117c7a370f1af704e4cc0.jpg');">

        <div style="background-image: url('https://i.pinimg.com/1200x/a1/a1/8e/a1a18ee7c7e086092005ce67f2b5ce6f.jpg');">
