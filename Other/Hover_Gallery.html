<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hover Gallery</title>
    <link rel="icon" href="https://i.pinimg.com/1200x/fa/b1/68/fab1680131bfa2102c2b7a63084347a9.jpg">
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: sans-serif;
        }

        #particles-js {
            background-color: #000;
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .image-container {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: top;
            gap: 20px;
            padding: 40px;
            height: 100vh;
            user-select: none;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            color: #fff;
            margin: 5rem;
            text-shadow: 0 2px 10px #000;
            z-index: 10;
        }

        .hover-image {
            object-fit: cover;
            width: auto;
            max-width: 200px;
            height: auto;
            box-shadow: 0 2px 20px #000;
            transition: transform 0.2s ease-out;
            will-change: transform;
        }

        /* Images */
        .one {
            position: absolute;
            height: auto;
            width: 120px;
            left: 10%;
            top: 18%;
        }

        .two {
            position: absolute;
            height: 300px;
            width: 300px;
            left: 30%;
            top: 40%;
        }

        .three {
            position: absolute;
            height: auto;
            width: 150px;
            left: 22%;
            bottom: 15%;
        }

        .four {
            position: absolute;
            height: 200px;
            width: 200px;
            right: 18%;
            top: 60%;
        }

        .five {
            position: absolute;
            height: 300px;
            width: 200px;
            right: 5%;
            top: 23%;
        }

        .six {
            position: absolute;
            height: 200px;
            width: auto;
            right: 30%;
            top: 16%;
        }

        .seven {
            position: absolute;
            height: 150px;
            width: auto;
            left: 32%;
            top: 8%;
        }
    </style>
</head>

<body>

    <div id="particles-js">
    </div>
    <div class="image-container">
        <h1>Saruabh Art</h1>
        <img src="https://i.pinimg.com/736x/a0/30/e9/a030e97561a760a240d8c63ced700115.jpg" class="hover-image one"
            alt="Image 1">
        <img src="https://i.pinimg.com/1200x/87/ad/0d/87ad0d765df6a9434585cc7874deac67.jpg" class="hover-image two"
            alt="Image 2">
        <img src="https://i.pinimg.com/736x/f2/24/74/f22474d2ee64e2b832a61394ca682989.jpg" class="hover-image three"
            alt="Image 3">
        <img src="https://i.pinimg.com/1200x/7b/ac/e7/7bace75d842df61f2f96cd5ab3ac1365.jpg" class="hover-image four"
            alt="Image 4">
        <img src="https://i.pinimg.com/1200x/95/81/41/9581412d748dc471633b054339142951.jpg" class="hover-image five"
            alt="Image 5">
        <img src="https://i.pinimg.com/736x/2f/9b/2c/2f9b2c7e97e117c7a370f1af704e4cc0.jpg" class="hover-image six"
            alt="Image 6">
        <img src="https://i.pinimg.com/1200x/a1/a1/8e/a1a18ee7c7e086092005ce67f2b5ce6f.jpg" class="hover-image seven"
            alt="Image 7">
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        const container = document.querySelector('.image-container');
        const images = document.querySelectorAll('.hover-image');

        container.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            const { width, height, left, top } = container.getBoundingClientRect();

            const percentX = (clientX - left) / width - 0.5;
            const percentY = (clientY - top) / height - 0.5;

            images.forEach((img, index) => {
                const depth = (index + 1) * 4; // Moment of Images on mouse moment
                const moveX = percentX * depth * 10;
                const moveY = percentY * depth * 10;
                img.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });

        container.addEventListener('mouseleave', () => {
            images.forEach(img => {
                img.style.transform = 'translate(0, 0)';
            });
        });

        // Particle.js setup
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": false },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 200, "color": "#ffffff", "opacity": 0.6, "width": 1 },
                "move": {
                    "enable": true,
                    "speed": 3,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "grab" },
                    "onclick": { "enable": true, "mode": "push" },
                    "resize": true
                },
                "modes": {
                    "grab": { "distance": 200, "line_linked": { "opacity": 1 } },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });
    </script>

</body>

</html>
